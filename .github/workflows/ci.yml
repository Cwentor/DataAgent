name: CI

on:
  push:
    branches: [master]
  pull_request:
  # 夜跑（§4 项5）：每日凌晨跑全量测试 + golden 双模式，防回归漏网
  schedule:
    - cron: "17 4 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Black format check
        run: black --check .
      - name: Ruff lint check
        run: ruff check .
      # 文档链接完整性门禁：docs 五类目录规范（docs/README.md）要求跨类目互链用
      # 相对路径，而相对链接在目录迁移/文件改名后最容易失效——`docs/...` 全路径
      # grep 覆盖不到（如 `../.env.example` 随文件下沉需多退一层），故由脚本兜底。
      - name: Docs link check
        run: python scripts/check_docs_links.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Rebuild mock warehouse
        run: python -m mock.init_duckdb
      - name: Run pytest
        run: python -m pytest -q
      - name: Run golden eval (oracle)
        run: python -m eval.eval_runner
      - name: Run golden eval (agent heuristic)
        run: python -m eval.eval_runner --pipeline agent
      - name: Run intent routing eval
        run: python -m eval.intent_eval

  # MySQL 服务级门禁（二十一期）：PR / master push / 夜跑均执行——
  # golden 全量 DSL 双后端一致性 + Review Focus 专项（周边界/5 年递归补零/
  # comparison 配对/池复用加固）。CI 无此 job 时 PR 绿不等于 MySQL 链路已验证。
  mysql-parity:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gmall
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Build MySQL warehouse (DDL transpiled + same-source data)
        run: python -m mock.init_mysql
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: gmall
      - name: Dual-backend parity tests (golden DSLs + Review Focus)
        run: python -m pytest tests/test_dual_backend_parity.py -q
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: "3306"
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: root
          MYSQL_TEST_DATABASE: gmall
      # 二十四期：目录构建纳入服务级验证（此前 parity job 只跑 DSL 一致性，
      # ensure_db/refresh_catalog 在 MySQL 上从未真实执行过）。这一步同时实锤
      # physical_columns 的 `%s` 参数化在真实 pymysql 上生效（Review Focus 4）。
      - name: Catalog refresh smoke (physical columns from real backend)
        run: |
          python -m semantic.catalog_loader | tee /tmp/catalog_smoke.txt
          grep -q "^fact_table=order_detail" /tmp/catalog_smoke.txt
        env:
          DB_BACKEND: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: gmall

  # PostgreSQL 服务级门禁（二十二期）：与 mysql-parity 同构——golden 全量 DSL
  # 双后端一致性 + 周边界/5 年补零/comparison 配对/池复用加固。本地开发不跑 PG
  # （POSTGRES_TEST_* 未配置自动跳过），CI 是 PG 链路首个真实执行面（spec §9 R1）。
  postgres-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_USER: postgres
          POSTGRES_DB: gmall
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Build PostgreSQL warehouse (DDL transpiled + same-source data)
        run: python -m mock.init_postgres
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DATABASE: gmall
      - name: Dual-backend parity tests (golden DSLs + Review Focus)
        run: python -m pytest tests/test_pg_backend_parity.py -q
        env:
          POSTGRES_TEST_HOST: 127.0.0.1
          POSTGRES_TEST_PORT: "5432"
          POSTGRES_TEST_USER: postgres
          POSTGRES_TEST_PASSWORD: root
          POSTGRES_TEST_DATABASE: gmall
      # 二十四期：目录构建纳入服务级验证（见 mysql-parity 同名步骤说明）。
      # 同时覆盖 POSTGRES_SCHEMA 过滤——不过滤会把 pg_catalog/其他 schema 的列
      # 混进目录。
      - name: Catalog refresh smoke (physical columns from real backend)
        run: |
          python -m semantic.catalog_loader | tee /tmp/catalog_smoke.txt
          grep -q "^fact_table=order_detail" /tmp/catalog_smoke.txt
        env:
          DB_BACKEND: postgres
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DATABASE: gmall
          POSTGRES_SCHEMA: public

  # ClickHouse 服务级门禁（二十三期）：与 postgres-parity 同构——golden 全量 DSL
  # 双后端一致性 + 熔断/周边界/补零/池复用专项。readonly 预算由仓库内 users.d
  # 配置承载（CH readonly 由 profile 承载、无法会话级 SET，spec D12）；TZ=UTC
  # 时区确定性（spec D13）。本地不跑 CH（CLICKHOUSE_TEST_* 未配置自动跳过）。
  #
  # 容器不用 services 而用 step 内 docker run：services 在 steps 之前启动，此时
  # checkout 尚未执行、仓库内 users.d 文件不存在（volume 挂载只会得到空目录，
  # 只读账号不生效）；step 内启动可保证挂载顺序正确。
  clickhouse-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start ClickHouse (readonly profile mounted as single file)
        run: |
          # 单文件挂载而非整目录只读挂载：官方 entrypoint 启动时要往 users.d 写
          # default-user.xml，整目录 :ro 会触发 "Read-only file system" 并禁用
          # default 用户网络访问，导致启动超时。
          # CLICKHOUSE_USER/PASSWORD 显式给出，避免 entrypoint 走
          # "neither ... is set, disabling network access for user 'default'" 分支。
          docker run -d --name ch-ci \
            -p 8123:8123 \
            -e TZ=UTC \
            -e CLICKHOUSE_USER=default \
            -e CLICKHOUSE_PASSWORD=ch_ci_pwd \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            -v "${{ github.workspace }}/.github/clickhouse/users.d/dataagent_ro.xml:/etc/clickhouse-server/users.d/dataagent_ro.xml:ro" \
            clickhouse/clickhouse-server:24.8
          for i in $(seq 1 40); do
            if docker exec ch-ci clickhouse-client --user default --password ch_ci_pwd \
              --query "SELECT 1" >/dev/null 2>&1; then
              echo "ClickHouse ready"
              exit 0
            fi
            sleep 3
          done
          echo "ClickHouse 启动超时"
          docker logs ch-ci
          exit 1
      - name: Create database (image has no init-db env like MYSQL_DATABASE)
        run: |
          docker exec ch-ci clickhouse-client --user default --password ch_ci_pwd \
            --query "CREATE DATABASE IF NOT EXISTS gmall"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Build ClickHouse warehouse (DDL transpiled + same-source data)
        run: python -m mock.init_clickhouse
        env:
          DB_BACKEND: clickhouse
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ch_ci_pwd
          CLICKHOUSE_DATABASE: gmall
      - name: Dump schema on failure (diagnostic)
        if: failure()
        run: |
          docker exec ch-ci clickhouse-client --user default --password ch_ci_pwd \
            --query "SHOW CREATE TABLE gmall.user_info FORMAT TSVRaw" || true
      - name: Create readonly account and grant (after warehouse exists)
        run: |
          # 用户必须用 SQL 建（users_xml 存储对 GRANT 只读）；profile 仍取自
          # users.d XML，保证 readonly=1 与预算由服务端承载、客户端不可篡改。
          ch() { docker exec ch-ci clickhouse-client --user default --password ch_ci_pwd --query "$1"; }
          ch "CREATE USER IF NOT EXISTS dataagent_ro IDENTIFIED WITH sha256_password BY 'ch_ro_pwd' SETTINGS PROFILE 'ch_ro_profile'"
          ch "GRANT SELECT ON *.* TO dataagent_ro"
          docker exec ch-ci clickhouse-client --user dataagent_ro --password ch_ro_pwd \
            --query "SELECT value FROM system.settings WHERE name = 'readonly'"
      - name: Dual-backend parity tests (golden DSLs + Review Focus)
        run: python -m pytest tests/test_clickhouse_backend_parity.py -q
        env:
          DB_BACKEND: duckdb
          CLICKHOUSE_TEST_HOST: 127.0.0.1
          CLICKHOUSE_TEST_PORT: "8123"
          CLICKHOUSE_TEST_USER: dataagent_ro
          CLICKHOUSE_TEST_PASSWORD: ch_ro_pwd
          CLICKHOUSE_TEST_DATABASE: gmall
      # 二十四期：目录构建纳入服务级验证。刻意用 **只读账号** dataagent_ro ——
      # 同时实锤只读账号可读 system.columns（spec §10 R1：CH 的元数据面走
      # system 库而非 information_schema，权限模型不同）。
      - name: Catalog refresh smoke (physical columns from real backend)
        run: |
          python -m semantic.catalog_loader | tee /tmp/catalog_smoke.txt
          grep -q "^fact_table=order_detail" /tmp/catalog_smoke.txt
        env:
          DB_BACKEND: clickhouse
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_USER: dataagent_ro
          CLICKHOUSE_PASSWORD: ch_ro_pwd
          CLICKHOUSE_DATABASE: gmall

  # Hive 服务级门禁（二十五期）：与 clickhouse-parity 同构（step 内 docker run）——
  # golden 全量 DSL 双后端一致性 + 周边界/补零/comparison/池复用专项。本地不跑
  # Hive（HIVE_TEST_* 未配置自动跳过）。容器为单容器 HiveServer2 + 内嵌 Derby
  # （apache/hive 官方镜像），HTTP transport 是三平台统一 requirements 的唯一
  # 通道（spec D2：sasl 包在 Windows 无官方 wheel）。
  #
  # 实测坑（spec §0，CI 配置已固化）：
  # - /tmp/hive 权限：镜像 entrypoint 启动 hiveserver2 时 Hadoop 权限检查失败
  #   会进入 60s 重试循环，容器启动后立即 chmod 1777 使下一轮重试成功；
  # - hive-site.xml 必须含镜像默认的全部配置（warehouse.dir/tez local 模式等），
  #   单文件 :ro 挂载是整体替换——仅写 transport 四项会把 warehouse 打回
  #   /user/hive/warehouse 导致建表失败；
  # - staging 卷挂载同路径：LOAD DATA LOCAL INPATH 的 LOCAL 是 hiveserver2
  #   进程本地路径，client/server 两目录经卷映射为同一内容（spec D10）。
  hive-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start HiveServer2 (single container, embedded Derby, HTTP transport)
        run: |
          mkdir -p "${{ github.workspace }}/build/hive_staging"
          docker run -d --name hive-ci \
            -p 10000:10000 \
            -e SERVICE_NAME=hiveserver2 \
            -e TZ=UTC \
            -v "${{ github.workspace }}/.github/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro" \
            -v "${{ github.workspace }}/build/hive_staging:/opt/dataagent_staging" \
            apache/hive:4.0.0
          # /tmp/hive 权限坑：Hadoop 权限检查失败进入 60s 重试，先放行权限
          docker exec hive-ci bash -c "mkdir -p /tmp/hive && chmod 1777 /tmp/hive"
          for i in $(seq 1 40); do
            if docker exec hive-ci beeline \
              -u "jdbc:hive2://localhost:10000/default;transportMode=http;httpPath=cliservice" \
              -n hive --silent=true --outputformat=tsv2 -e "SELECT 1" 2>/dev/null | grep -q "^1"; then
              echo "HiveServer2 ready"
              exit 0
            fi
            sleep 10
          done
          echo "HiveServer2 启动超时"
          docker logs hive-ci
          docker exec hive-ci tail -50 /tmp/hive/hive.log || true
          exit 1
      - name: Create database
        run: |
          docker exec hive-ci beeline \
            -u "jdbc:hive2://localhost:10000/default;transportMode=http;httpPath=cliservice" \
            -n hive --silent=true -e "CREATE DATABASE IF NOT EXISTS gmall"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Build Hive warehouse (DDL transpiled + same-source data via CSV staging)
        run: python -m mock.init_hive
        env:
          HIVE_HOST: 127.0.0.1
          HIVE_PORT: "10000"
          HIVE_USER: hive
          HIVE_PASSWORD: ""
          HIVE_DATABASE: gmall
          HIVE_STAGING_CLIENT_DIR: ${{ github.workspace }}/build/hive_staging
          HIVE_STAGING_SERVER_DIR: /opt/dataagent_staging
      - name: Dump schema on failure (diagnostic)
        if: failure()
        run: |
          docker exec hive-ci beeline \
            -u "jdbc:hive2://localhost:10000/default;transportMode=http;httpPath=cliservice" \
            -n hive --silent=true -e "SHOW CREATE TABLE gmall.user_info" || true
      - name: Dual-backend parity tests (golden DSLs + Review Focus)
        run: python -m pytest tests/test_hive_backend_parity.py -q
        env:
          HIVE_TEST_HOST: 127.0.0.1
          HIVE_TEST_PORT: "10000"
          HIVE_TEST_USER: hive
          HIVE_TEST_PASSWORD: ""
          HIVE_TEST_DATABASE: gmall
      - name: Catalog refresh smoke (physical columns from real backend)
        run: |
          python -m semantic.catalog_loader | tee /tmp/catalog_smoke.txt
          grep -q "^fact_table=order_detail" /tmp/catalog_smoke.txt
        env:
          DB_BACKEND: hive
          HIVE_HOST: 127.0.0.1
          HIVE_PORT: "10000"
          HIVE_USER: hive
          HIVE_PASSWORD: ""
          HIVE_DATABASE: gmall

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Rebuild mock warehouse
        run: python -m mock.init_duckdb
      - name: Run full pytest suite
        run: python -m pytest -q
      - name: Golden eval (oracle)
        run: python -m eval.eval_runner
      - name: Golden eval (agent heuristic)
        run: python -m eval.eval_runner --pipeline agent
      - name: Intent routing eval
        run: python -m eval.intent_eval
      - name: Boundary eval (能力边界三指标 + 红线矩阵)
        run: python -m eval.boundary_eval
      - name: RLS adversarial matrix (restricted x sensitive)
        run: python -m pytest -q tests/security/test_security.py tests/security/test_scope.py -k "rls or scope or adversarial or sensitive"

